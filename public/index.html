<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NAMEWRECKED — Roast & Rhyme. Put in a name. Get a song. Regret everything.">
  <title>NAMEWRECKED — Roast & Rhyme</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: white;
      background:
        radial-gradient(circle at top left, #5b21b6 0, transparent 35%),
        radial-gradient(circle at bottom right, #be123c 0, transparent 35%),
        #09090b;
    }

    .container {
      width: min(900px, 94%);
      margin: auto;
      padding: 30px 0 60px;
    }

    .hero {
      text-align: center;
      padding: 30px 10px;
    }

    .logo {
      font-size: clamp(42px, 10vw, 82px);
      font-weight: 1000;
      letter-spacing: -4px;
      text-transform: uppercase;
      text-shadow: 5px 5px 0 #000;
    }

    .subtitle {
      font-size: 20px;
      margin-top: 10px;
      color: #ddd;
    }

    .card {
      background: rgba(20, 20, 28, .88);
      border: 2px solid rgba(255,255,255,.12);
      border-radius: 24px;
      padding: 24px;
      margin-top: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,.4);
    }

    label {
      display: block;
      font-weight: 900;
      font-size: 18px;
      margin-bottom: 10px;
    }

    input {
      width: 100%;
      padding: 17px;
      border-radius: 15px;
      border: 2px solid #444;
      background: #09090b;
      color: white;
      font-size: 20px;
      outline: none;
    }

    input:focus {
      border-color: #fff;
    }

    .section-title {
      font-size: 22px;
      font-weight: 1000;
      margin: 25px 0 12px;
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    button.choice {
      padding: 15px 8px;
      border-radius: 15px;
      border: 2px solid #444;
      background: #18181b;
      color: white;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      transition: .15s;
    }

    button.choice:hover {
      transform: translateY(-2px);
      border-color: white;
    }

    button.choice.selected {
      border-color: white;
      background: #3f3f46;
      box-shadow: 0 0 18px rgba(255,255,255,.15);
    }

    .wreck {
      width: 100%;
      margin-top: 28px;
      padding: 20px;
      border: 0;
      border-radius: 18px;
      background: linear-gradient(90deg, #f43f5e, #8b5cf6, #06b6d4);
      color: white;
      font-size: 22px;
      font-weight: 1000;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 0 10px 35px rgba(139,92,246,.35);
    }

    .wreck:hover {
      transform: scale(1.01);
    }

    .result {
      display: none;
    }

    .result h2 {
      margin-top: 0;
      font-size: 30px;
    }

    .lyrics {
      white-space: pre-wrap;
      background: #050505;
      border-radius: 18px;
      padding: 20px;
      line-height: 1.7;
      font-size: 16px;
      border: 1px solid #333;
      max-height: 500px;
      overflow-y: auto;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 15px;
    }

    .controls button {
      padding: 14px 8px;
      border-radius: 13px;
      border: 1px solid #444;
      background: #18181b;
      color: white;
      font-weight: 900;
      cursor: pointer;
    }

    .controls button:hover {
      background: #27272a;
    }

    .now-playing {
      margin-top: 15px;
      padding: 14px;
      border-radius: 14px;
      background: #111827;
      text-align: center;
      font-weight: 900;
      color: #ddd;
    }

    .small {
      text-align: center;
      color: #999;
      margin-top: 20px;
      font-size: 13px;
    }

    @media (max-width: 650px) {
      .choices {
        grid-template-columns: repeat(2, 1fr);
      }

      .controls {
        grid-template-columns: repeat(2, 1fr);
      }

      .logo {
        letter-spacing: -2px;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <header class="hero">
      <div class="logo">NAMEWRECKED</div>
      <div class="subtitle">🎤 Roast & Rhyme</div>
      <p>Put in a name. Get a song. Regret everything. 💀</p>
    </header>

    <main class="card">

      <label for="name">Whose name are we wrecking?</label>
      <input
        id="name"
        type="text"
        maxlength="40"
        placeholder="Enter a name..."
        autocomplete="off"
      >

      <div class="section-title">Choose your chaos</div>

      <div class="choices" id="vibes">
        <button class="choice selected" data-value="funny">😂 Funny</button>
        <button class="choice" data-value="petty">💅 Petty</button>
        <button class="choice" data-value="unhinged">🤪 Unhinged</button>
        <button class="choice" data-value="rap">🎤 Rap</button>
        <button class="choice" data-value="party">🥳 Party</button>
        <button class="choice" data-value="kid">🧒 Kid Chaos</button>
      </div>

      <div class="section-title">Music vibe</div>

      <div class="choices" id="genres">
        <button class="choice selected" data-value="pop">🎶 Pop</button>
        <button class="choice" data-value="hip-hop">🔥 Hip-Hop</button>
        <button class="choice" data-value="r-and-b">💜 R&B</button>
        <button class="choice" data-value="country">🤠 Country</button>
        <button class="choice" data-value="dance">🪩 Dance</button>
        <button class="choice" data-value="rock">🎸 Rock</button>
      </div>

      <div class="section-title">Roast level</div>

      <div class="choices" id="intensity">
        <button class="choice selected" data-value="mild">🙂 Mild</button>
        <button class="choice" data-value="wrecked">💀 Wrecked</button>
        <button class="choice" data-value="maximum">🚨 Maximum Chaos</button>
      </div>

      <button class="wreck" id="generate">
        💀 WRECK THIS NAME
      </button>

    </main>

    <section class="card result" id="result">

      <h2 id="songTitle">🎵 Your NAMEWRECKED Song</h2>

      <div class="lyrics" id="lyrics"></div>

      <div class="now-playing" id="status">
        🎵 Ready to wreck.
      </div>

      <div class="controls">
        <button id="play">▶️ PLAY</button>
        <button id="stop">⏹️ STOP</button>
        <button id="worse">🤣 MAKE IT WORSE</button>
        <button id="remix">🔄 REMIX</button>
        <button id="copy">📋 COPY</button>
        <button id="share">📤 SHARE</button>
      </div>

    </section>

    <div class="small">
      NAMEWRECKED is a free MVP. Made for laughs. 💀
    </div>

  </div>

<script>
const state = {
  vibe: "funny",
  genre: "pop",
  intensity: "mild",
  lyrics: "",
  name: ""
};

let audioContext = null;
let masterGain = null;
let beatTimer = null;
let speechTimer = null;
let playing = false;

function selectGroup(id, key) {
  document.querySelectorAll("#" + id + " .choice").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("#" + id + " .choice")
        .forEach(x => x.classList.remove("selected"));

      btn.classList.add("selected");
      state[key] = btn.dataset.value;
    });
  });
}

selectGroup("vibes", "vibe");
selectGroup("genres", "genre");
selectGroup("intensity", "intensity");

const nameInput = document.getElementById("name");
const generateButton = document.getElementById("generate");
const result = document.getElementById("result");
const lyricsBox = document.getElementById("lyrics");
const songTitle = document.getElementById("songTitle");
const statusBox = document.getElementById("status");

async function generateSong() {
  const name = nameInput.value.trim();

  if (!name) {
    nameInput.focus();
    alert("Enter a name first! 💀");
    return;
  }

  generateButton.disabled = true;
  generateButton.textContent = "💀 WRECKING...";

  try {
    const response = await fetch("/api/generate", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        name,
        vibe: state.vibe,
        genre: state.genre,
        intensity: state.intensity
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Something went wrong.");
    }

    state.name = data.name;
    state.lyrics = data.lyrics;

    songTitle.textContent = "🎵 " + data.title;
    lyricsBox.textContent = data.lyrics;

    result.style.display = "block";
    statusBox.textContent =
      "🎵 " + data.genre.toUpperCase() +
      " • " + data.vibe.toUpperCase() +
      " • " + data.intensity.toUpperCase();

    result.scrollIntoView({
      behavior: "smooth",
      block: "start"
    });

  } catch (error) {
    alert(error.message);
  }

  generateButton.disabled = false;
  generateButton.textContent = "💀 WRECK THIS NAME";
}

generateButton.addEventListener("click", generateSong);

function getAudio() {
  if (!audioContext) {
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioContext.createGain();
    masterGain.gain.value = 0.12;
    masterGain.connect(audioContext.destination);
  }

  return audioContext;
}

function kick(time, frequency = 90) {
  const ctx = getAudio();

  const osc = ctx.createOscillator();
  const gain = ctx.createGain();

  osc.type = "sine";
  osc.frequency.setValueAtTime(frequency, time);
  osc.frequency.exponentialRampToValueAtTime(45, time + .12);

  gain.gain.setValueAtTime(.9, time);
  gain.gain.exponentialRampToValueAtTime(.001, time + .18);

  osc.connect(gain);
  gain.connect(masterGain);

  osc.start(time);
  osc.stop(time + .2);
}

function snare(time) {
  const ctx = getAudio();

  const buffer = ctx.createBuffer(
    1,
    ctx.sampleRate * .12,
    ctx.sampleRate
  );

  const data = buffer.getChannelData(0);

  for (let i = 0; i < data.length; i++) {
    data[i] = Math.random() * 2 - 1;
  }

  const source = ctx.createBufferSource();
  const gain = ctx.createGain();

  source.buffer = buffer;
  gain.gain.setValueAtTime(.35, time);
  gain.gain.exponentialRampToValueAtTime(.001, time + .12);

  source.connect(gain);
  gain.connect(masterGain);

  source.start(time);
}

function hat(time) {
  const ctx = getAudio();

  const buffer = ctx.createBuffer(
    1,
    ctx.sampleRate * .04,
    ctx.sampleRate
  );

  const data = buffer.getChannelData(0);

  for (let i = 0; i < data.length; i++) {
    data[i] = Math.random() * 2 - 1;
  }

  const source = ctx.createBufferSource();
  const gain = ctx.createGain();

  source.buffer = buffer;
  gain.gain.value = .12;

  source.connect(gain);
  gain.connect(masterGain);

  source.start(time);
}

function bass(time, frequency) {
  const ctx = getAudio();

  const osc = ctx.createOscillator();
  const gain = ctx.createGain();

  osc.type = "sawtooth";
  osc.frequency.value = frequency;

  gain.gain.setValueAtTime(.18, time);
  gain.gain.exponentialRampToValueAtTime(.001, time + .35);

  osc.connect(gain);
  gain.connect(masterGain);

  osc.start(time);
  osc.stop(time + .4);
}

function startBeat() {
  stopBeatOnly();

  const ctx = getAudio();
  ctx.resume();

  playing = true;

  const bpmMap = {
    pop: 112,
    "hip-hop": 92,
    "r-and-b": 82,
    country: 104,
    dance: 124,
    rock: 128
  };

  const bpm = bpmMap[state.genre] || 110;
  const beatLength = 60000 / bpm;

  let step = 0;

  function tick() {
    if (!playing) return;

    const now = ctx.currentTime + .02;

    if (step % 4 === 0) kick(now);
    if (step % 4 === 2) snare(now);

    hat(now);

    if (step % 4 === 0) {
      const notes = {
        pop: 110,
        "hip-hop": 82,
        "r-and-b": 73,
        country: 98,
        dance: 65,
        rock: 87
      };

      bass(now, notes[state.genre] || 90);
    }

    step++;
    beatTimer = setTimeout(tick, beatLength / 2);
  }

  tick();
}

function stopBeatOnly() {
  playing = false;

  if (beatTimer) {
    clearTimeout(beatTimer);
    beatTimer = null;
  }
}

function cleanLyrics(text) {
  return text
    .replace(/\[VERSE.*?\]/gi, "")
    .replace(/\[CHORUS\]/gi, "")
    .replace(/\[OUTRO\]/gi, "")
    .replace(/\n{2,}/g, "\n")
    .trim();
}

function speakSong() {
  if (!("speechSynthesis" in window)) {
    alert("Your browser doesn't support voice playback.");
    return;
  }

  speechSynthesis.cancel();

  const text = cleanLyrics(state.lyrics);

  const sentences = text
    .split(/\n+/)
    .map(x => x.trim())
    .filter(Boolean);

  let index = 0;

  function nextLine() {
    if (!playing || index >= sentences.length) {
      if (index >= sentences.length) {
        statusBox.textContent = "🎤 SONG FINISHED!";
        stopBeatOnly();
      }
      return;
    }

    const utterance = new SpeechSynthesisUtterance(sentences[index]);

    utterance.rate =
      state.genre === "hip-hop" ? 1.05 :
      state.genre === "dance" ? 1.1 :
      0.95;

    utterance.pitch =
      state.vibe === "kid" ? 1.25 :
      state.vibe === "unhinged" ? 1.15 :
      1.0;

    utterance.onend = () => {
      index++;
      nextLine();
    };

    speechSynthesis.speak(utterance);
  }

  nextLine();
}

function playSong() {
  if (!state.lyrics) {
    alert("Wreck a name first! 💀");
    return;
  }

  speechSynthesis.cancel();

  startBeat();

  statusBox.textContent =
    "🎵 PLAYING " + state.genre.toUpperCase() +
    " BEAT + VOCALS";

  speakSong();
}

function stopSong() {
  playing = false;

  speechSynthesis.cancel();
  stopBeatOnly();

  statusBox.textContent = "⏹️ Stopped.";
}

document.getElementById("play").addEventListener("click", playSong);
document.getElementById("stop").addEventListener("click", stopSong);

document.getElementById("worse").addEventListener("click", async () => {
  state.intensity = "maximum";

  document.querySelectorAll("#intensity .choice")
    .forEach(x => x.classList.remove("selected"));

  document
    .querySelector('#intensity .choice[data-value="maximum"]')
    .classList.add("selected");

  await generateSong();
});

document.getElementById("remix").addEventListener("click", async () => {
  await generateSong();
});

document.getElementById("copy").addEventListener("click", async () => {
  if (!state.lyrics) return;

  await navigator.clipboard.writeText(state.lyrics);
  statusBox.textContent = "📋 COPIED!";
});

document.getElementById("share").addEventListener("click", async () => {
  const shareData = {
    title: "NAMEWRECKED",
    text: state.lyrics
      ? `${songTitle.textContent}\n\n${state.lyrics}`
      : "Check out NAMEWRECKED — Roast & Rhyme!",
    url: window.location.href
  };

  try {
    if (navigator.share) {
      await navigator.share(shareData);
    } else {
      await navigator.clipboard.writeText(
        `${shareData.text}\n\n${shareData.url}`
      );

      statusBox.textContent = "📤 SHARE TEXT COPIED!";
    }
  } catch (error) {
    console.log("Share cancelled.");
  }
});

nameInput.addEventListener("keydown", event => {
  if (event.key === "Enter") {
    generateSong();
  }
});
</script>

</body>
</html>
